name: Deploy Frontend to Digital Ocean

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Create production environment file
      run: |
        cat > .env.production << EOF
        NODE_ENV=production
        NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        NEXT_PUBLIC_APP_NAME=${{ secrets.NEXT_PUBLIC_APP_NAME }}
        NEXT_PUBLIC_APP_DESCRIPTION=${{ secrets.NEXT_PUBLIC_APP_DESCRIPTION }}
        EOF

    - name: Build application
      run: npm run build
      env:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        NEXT_PUBLIC_APP_NAME: ${{ secrets.NEXT_PUBLIC_APP_NAME }}
        NEXT_PUBLIC_APP_DESCRIPTION: ${{ secrets.NEXT_PUBLIC_APP_DESCRIPTION }}

    - name: Deploy to Digital Ocean
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.DO_HOST }}
        username: ${{ secrets.DO_USERNAME }}
        key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        port: 22
        source: ".next/standalone/,.next/static/,public/,package.json,.env.production"
        target: "/var/www/ivaa-adsync-frontend/"
        strip_components: 0
        timeout: 120s
        debug: true

    - name: Setup and start application on server
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DO_HOST }}
        username: ${{ secrets.DO_USERNAME }}
        key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        port: 22
        timeout: 120s
        debug: true
        script: |
          set -e
          cd /var/www/ivaa-adsync-frontend

          # Create directory structure if it doesn't exist
          mkdir -p .next/standalone/.next/static
          mkdir -p .next/standalone/public

          # Copy static files to standalone directory
          if [ -d ".next/static" ]; then
            cp -r .next/static .next/standalone/.next/ || echo "Static files copy failed"
          fi

          if [ -d "public" ]; then
            cp -r public .next/standalone/ || echo "Public files copy failed"
          fi

          # Set environment file
          if [ -f ".env.production" ]; then
            cp .env.production .next/standalone/.env
          fi

          # Install PM2 if not present
          if ! command -v pm2 &> /dev/null; then
            npm install -g pm2
          fi

          # Restart application using PM2
          cd .next/standalone
          pm2 restart ivaa-frontend || pm2 start server.js --name "ivaa-frontend" --time